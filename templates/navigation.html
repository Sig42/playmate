{% load active_page %}

<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item" lang="en">
          <a class="nav-link {% active_url request 'home_page' %} navbar-brand" href="/">Playmate</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% active_url request '!!!!!!!!!!!!!!!!!!!!!!!' %}" href="#">Сообщения</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% active_url request 'main:games' %}"
             href="{% url 'main:games' %}">Игры</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% active_url request 'main:game_anns' %}" href="{% url 'main:game_anns' %}">Игротеки</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% active_url request 'main:test_anns' %}" href="{% url 'main:test_anns' %}">Разработчики</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% active_url request 'main:tournament_anns' %}"
             href="{% url 'main:tournament_anns' %}">Турниры</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% active_url request 'main:sale_anns' %}" href="{% url 'main:sale_anns' %}">Барахолка</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% active_url request '!!!!!!!!!!!!!!!!!!!!!!!' %}" href="#">Инфо</a>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          {% if user.is_authenticated %}
              <li class="nav-item">
                  <a class="nav-link {% active_url request '!!!!!!!!!!!!!!!!!!!!!!!!' %}" href="#">
                      {{ user.username }}
                  </a>
              </li>
              <li class="nav-item">
                  <form action="{% url 'logout' %}" method="post">
                      {% csrf_token %}
                      <a class="nav-link" href="#" onclick="parentNode.submit()">Выход</a>
                  </form>
              </li>
          {% else %}
              <li class="nav-item">
                  <a class="nav-link {% active_url request 'accounts:signup' %}" href="{% url 'accounts:signup' %}">
                      Регистрация
                  </a>
              </li>
              <li class="nav-item">
                  <a class="nav-link" href="accounts/login/">Войти</a>

          {% endif %}
